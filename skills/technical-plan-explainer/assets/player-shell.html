<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>技术方案动画讲解</title>
<style>
:root{--ink:#173f36;--muted:#52665d;--paper:#f5f2e9;--green:#087454;--line:#cbd6c8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:28px 24px 50px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px;color:var(--muted)}.badge{border:1px solid var(--line);border-radius:24px;padding:7px 12px;font-size:12px}h1{font-size:32px;line-height:1.4;margin:24px 0 12px}p{line-height:1.85}.intro{font-size:14px;color:var(--muted);margin-bottom:24px}.film{border:1px solid #b9cbb7;border-radius:20px;overflow:hidden;box-shadow:0 14px 48px #264a3310;background:#fffdf7}hyperframes-player{display:block;width:100%;aspect-ratio:16/9;background:var(--paper)}.controls{padding:16px 20px;border-top:1px solid var(--line)}#seek{width:100%;accent-color:var(--green);cursor:pointer;margin:0 0 14px}.buttons{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer}button:hover,button:focus-visible{border-color:var(--green);background:#e9f0e4}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--ink);border-color:var(--ink);color:#fffdf7;min-width:112px;font-weight:650}.primary:hover{background:var(--green);color:#fffdf7}#time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.spacer{flex:1}label{font-size:13px;color:var(--muted)}nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}nav button{flex:1;min-width:115px;text-align:left;background:#fdfbf3}nav button.active{border-color:var(--green);background:#e4eddf}nav small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.now{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:20px;font-size:14px}#show-source{font-size:12px;white-space:nowrap}#live-caption{font-size:20px;min-height:65px;max-width:1050px}.note,#status,footer{color:var(--muted);font-size:12px;line-height:1.85}.panels{border-top:1px solid var(--line)}details{border-bottom:1px solid var(--line);padding:18px 0}summary{font-weight:650;font-size:15px;cursor:pointer}.script p{font-size:16px}blockquote{margin:12px 0 22px;padding:12px 18px;background:#edf0e6;border-radius:10px;font-size:13px;line-height:1.9}h3{font-size:15px;margin-top:24px}.sources{scroll-margin-top:20px}footer{margin-top:22px}.reduced{display:none}@media(prefers-reduced-motion:reduce){.reduced{display:block}}@media(max-width:680px){main{padding:18px 12px 35px}header{font-size:11px;gap:8px}.badge{font-size:10px}h1{font-size:25px;margin-top:22px}.intro{font-size:13px;margin-bottom:18px}.film{border-radius:14px}.controls{padding:12px}.buttons{gap:8px}button,select{font-size:13px;padding:9px 10px}.spacer{display:none}label{margin-left:auto}nav{gap:6px}nav button{min-width:95px}#live-caption{font-size:17px;min-height:90px}.now{font-size:13px;align-items:flex-start}#show-source{font-size:11px}.script p{font-size:15px}}
</style></head><body><main>
<header><span>技术方案 / 动画讲解</span><span class="badge" id="badge">Cove · 离线可播</span></header><h1 id="title"></h1><p id="intro" class="intro"></p>
<div class="film"><hyperframes-player id="player" aria-label="技术方案动画"></hyperframes-player><div class="controls"><input id="seek" type="range" min="0" step="0.05" value="0" aria-label="播放进度，单位秒"><div class="buttons"><button class="primary" id="toggle" disabled>正在准备…</button><span id="time"></span><button id="replay">↺ 重播</button><span class="spacer"></span><label for="speed">播放速度</label><select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button id="read">阅读讲稿</button></div></div></div>
<nav id="chapters" aria-label="讲解章节"></nav><div class="now"><strong id="point"></strong><button id="show-source">查看原文依据 ↗</button></div><p id="live-caption"></p><p id="status" role="status">正在准备本地动画与配音…</p><p class="note reduced">系统已启用减少动态效果偏好，可选择“阅读讲稿”静态阅读。</p>
<div class="panels"><details id="script" class="script"><summary>完整讲稿 · 静态阅读</summary><div id="script-body"></div></details><details id="sources" class="sources"><summary>原文依据与术语</summary><div id="source-body"></div><div id="glossary"></div></details><details><summary>制作与许可</summary><p class="note" id="credits"></p><p class="note">声音：已确认的 Cove 原始母版，参考配音生成。示意对象、推断与源文档事实按依据区分。</p><details><summary>HyperFrames 许可全文</summary><pre id="license" style="white-space:pre-wrap;font-size:11px;line-height:1.65"></pre></details></details></div><footer>单文件离线讲解 · 源项目保留讲稿、分镜、媒体、来源与校验记录。</footer></main>
<script>@@PLAYER@@</script><script>
const D=@@DATA@@;
const el=id=>document.getElementById(id),p=el('player'),toggle=el('toggle'),seek=el('seek');
window.samplePlayer=p;
document.title=D.title;el('title').textContent=D.title;el('intro').textContent=D.description||'跟随一个贯穿案例，看懂方案的工作过程、关键机制与边界。';el('license').textContent=D.license;el('credits').textContent=D.credits;
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
seek.max=D.duration;el('badge').textContent=fmt(D.duration)+' · Cove · 离线可播';p.setAttribute('width',D.width);p.setAttribute('height',D.height);p.style.aspectRatio=D.width+'/'+D.height;
function add(parent,tag,text){const n=document.createElement(tag);n.textContent=text;parent.append(n);return n;}
D.script.trim().split(/\n\s*\n/).forEach(t=>add(el('script-body'),'p',t));
D.sources.forEach(r=>{const s=document.createElement('section');s.id='ref-'+r.id;add(s,'h3',r.id+' · '+(r.section||r.location));add(s,'blockquote',r.quote);el('source-body').append(s);});
D.glossary.forEach(g=>{const n=add(el('glossary'),'p','');add(n,'b',g.term+'：');n.append(document.createTextNode(g.definition));});
D.chapters.forEach((c,i)=>{const b=document.createElement('button');b.dataset.chapter=i;b.textContent=String(i+1).padStart(2,'0')+'　'+c.title;add(b,'small',fmt(c.start));b.onclick=()=>{p.seek(c.start);update();};el('chapters').append(b);});
function update(){const t=p.currentTime||0;seek.value=t;seek.setAttribute('aria-valuetext',fmt(t)+'，总长 '+fmt(D.duration));el('time').textContent=fmt(t)+' / '+fmt(D.duration);toggle.textContent=p.paused?'▶ 有声播放':'Ⅱ 暂停';const c=D.chapters.findLast(c=>t>=c.start)||D.chapters[0];el('point').textContent=c.summary;document.querySelectorAll('[data-chapter]').forEach((b,i)=>{const on=D.chapters[i]===c;b.classList.toggle('active',on);b.setAttribute('aria-current',on?'step':'false');});const s=D.cues.findLast(s=>t>=s.start);el('live-caption').textContent=s?s.text:'点击“有声播放”，开始讲解。';}
function ready(){if(p.ready&&p.assetsReady){if(Math.abs(p.duration-D.duration)>.05){el('status').textContent='动画时长与项目不一致，请检查源项目。';return;}toggle.disabled=false;el('status').textContent='配音与动画已就绪 · 点击播放启用声音 · 章节跳转暂停后可继续播放';update();}}
['ready','assetsready','painted'].forEach(e=>p.addEventListener(e,ready));['timeupdate','play','pause','ended'].forEach(e=>p.addEventListener(e,update));p.addEventListener('error',()=>{el('status').textContent='播放出现问题，请检查项目验收记录。';});
toggle.onclick=()=>{p.paused?p.play():p.pause();update();};seek.oninput=()=>{p.seek(Number(seek.value));update();};el('replay').onclick=()=>{p.seek(0);p.play();update();};el('speed').onchange=e=>{p.playbackRate=Number(e.target.value);};
function show(id){p.pause();el(id).open=true;el(id).scrollIntoView({behavior:'instant',block:'start'});update();}el('read').onclick=()=>show('script');el('show-source').onclick=()=>{show('sources');const c=D.chapters.findLast(c=>p.currentTime>=c.start)||D.chapters[0];el('ref-'+c.source_refs[0])?.scrollIntoView({behavior:'instant',block:'center'});};
p.setAttribute('srcdoc',D.composition);
</script></body></html>
